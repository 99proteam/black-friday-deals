name: Build README

# On pushes to main or dev: rebuild README.md from deals.yml and commit it.
# On pull requests: only check that README.md matches deals.yml.

on:
  pull_request:
    paths:
      - deals.yml
      - README.md
      - scripts/**
  push:
    branches: [main, dev]
    paths:
      - deals.yml
      - README.md
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Check README.md is in sync (pull requests)
        if: github.event_name == 'pull_request'
        run: python scripts/build_readme.py --check

      - name: Rebuild README.md and commit it (pushes)
        if: github.event_name != 'pull_request'
        run: |
          python scripts/build_readme.py
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Rebuild README.md from deals.yml"
          git push
