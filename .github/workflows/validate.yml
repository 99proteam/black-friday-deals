name: Validate deals

on:
  pull_request:
    paths:
      - deals.yml
      - README.md
      - scripts/**
  push:
    branches: [main, dev]
    paths:
      - deals.yml
      - README.md
      - scripts/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check deals.yml and README.md are in sync
        run: python scripts/build_readme.py --check
