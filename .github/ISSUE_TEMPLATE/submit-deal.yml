name: "🏷️ Submit a deal"
description: Suggest a Black Friday or Cyber Monday deal for DevOps, SRE or MLOps engineers.
title: "[Deal]: "
labels: ["new deal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing a deal! Please fill in what you know. A maintainer will check it before it goes on the list.
  - type: input
    id: product
    attributes:
      label: Product name
      placeholder: KodeKloud
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - 🎓 Learning Platforms
        - 📜 Certifications
        - 🌐 Hosting Platforms
        - ☁️ Free Cloud Credits
        - 🧠 Interview Prep & System Design
        - 📚 Books & Reading
        - 🎬 Creator Tools
        - Other (explain below)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official deal link
      placeholder: https://example.com/black-friday
    validations:
      required: true
  - type: input
    id: offer
    attributes:
      label: What is the deal?
      placeholder: 50% off annual plans
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Coupon code (if any)
      placeholder: BF2026
  - type: input
    id: valid
    attributes:
      label: Valid until
      placeholder: Dec 2, 2026
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Renewal price, regions, plan limits, and so on.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the deal on the vendor's official page today.
          required: true
        - label: This deal is useful for DevOps, SRE, Platform, Cloud or MLOps engineers.
          required: true
